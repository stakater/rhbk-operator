apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .name }}-postgres
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-15-c9s:latest
          env:
            - name: POSTGRESQL_USER
              value: "{{ .dbUser }}"
            - name: POSTGRESQL_PASSWORD
              value: "{{ .dbPassword }}"
            - name: POSTGRESQL_DATABASE
              value: keycloak
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}-postgres
spec:
  selector:
    app: {{ .name }}-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
